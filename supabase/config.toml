# Supabase local dev config — Kommessa
# Region target prod: Frankfurt (eu-central-1) — vedi documentazione_generale/02_ARCHITETTURA/Stack_Tecnico.md
project_id = "kommessa"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://kommessa.it"
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://localhost:3000",
  "http://m.localhost:3000",
  "http://cliente.localhost:3000",
  "https://www.kommessa.it/auth/callback",
  "https://kommessa.it/auth/callback",
  "https://bertaiolaimpianti.vercel.app/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
inspector_port = 8083

# Default per le Edge Functions: verify_jwt = true (impostato dal CLI).
# Override per singola funzione qui sotto quando l'auth non è via JWT utente.

# Webhook esterni (Resend) → autenticati con HMAC, non JWT
[functions.inbound-email]
verify_jwt = false

# ⚠️ RIMOSSE il 07/10/2026: `notify-event`, `onboard-tenant` e `ai-name`.
# Nessun chiamante: nessun `functions.invoke`, nessun `net.http_post` nelle
# migration, nessun cron. Il provisioning di un cliente lo fa `creaTenant` in
# TypeScript, il suggerimento del nome cartella lo fa `/api/suggerisci-nome`
# chiamando OpenAI direttamente, e la catena delle notifiche push non ha mai
# avuto un mittente vivo. I cron veri non passano da Edge Functions: chiamano
# rotte Next via `net.http_post` (vedi le migration `cron_*`).
#
# Restano deployate sul progetto remoto finché non si esegue:
#   supabase functions delete notify-event onboard-tenant ai-name
